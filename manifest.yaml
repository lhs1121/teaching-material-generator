name: 课堂教学材料生成器
slug: teaching-material-generator
version: 0.4.0
description: 面向职业教育（高职/本科）教师与课程开发者，支持岗位驱动与章节驱动双路径，一次性生成「教案全文 + 配套课件大纲 + 说课稿」三份结构化 Markdown 教学材料。岗位驱动路径从岗位典型工作任务出发，产出理实一体化十章教案（理论线与实践线并行，含学情分析、课程思政融入点与实践任务书，可对接实训任务生成）；章节驱动路径从教材章节出发，产出标准九章教案。统一遵守职业教育编写铁律。
